<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Word Bomb</title>
    <link rel="stylesheet" href="/static/ui.css"><link rel="stylesheet" href="/static/lobbyMenu.css">
</head>
<body>
<main class="app-shell">
    <nav class="topbar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">あ</span> WORD BOMB <span class="badge">日本語</span></a></nav>
    <section class="menu-layout">
        <div class="hero">
            <h1 data-en="Japanese&#10;Word Bomb" data-jp="日本語&#10;ワードボム">Japanese<br>Word Bomb</h1>
            <p class="hero-subtitle" data-en="日本語ワードボム" data-jp="Japanese Word Bomb">日本語ワードボム</p>
            <div class="kana-art" aria-hidden="true"><span>あ</span><span>い</span><span>う</span></div>
        </div>
        <div class="menu-actions">
            <h2 id="welcome">Create or Join a Lobby</h2>
            <section class="panel create-panel"><h3 class="section-heading" data-en="01 Start a Game" data-jp="01 ゲームを始める">01 Start a Game</h3><button class="primary full-width" onclick="createLobby()" id="create-lobby">Create Lobby</button></section>
            <section class="panel join-panel"><h3 class="section-heading" data-en="02 Join a Lobby" data-jp="02 ロビーに参加">02 Join a Lobby</h3><label for="join-code"><span id="code-input">Room code</span></label><form id="join-form" class="code-row"><input id="join-code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" aria-label="Lobby code" required><button class="primary" id="join-lobby" type="submit">Join</button></form><p class="error" id="wrong-code" style="visibility:hidden" role="alert">Invalid lobby code!</p></section>
            <div class="extras"><label class="language-label"><span id="language-text">Language:</span><select id="language-switch"><option value="en">English</option><option value="jp">日本語</option></select></label><button class="quiet" id="instructions-btn">How to Play</button></div>
        </div>
    </section>
</main>
<dialog id="instructions-modal" aria-labelledby="instructions-header"><div class="dialog-heading"><div><h2 id="instructions-header">How to Play</h2></div><button class="close-btn" aria-label="Close">×</button></div><p id="instructions-body" class="muted instructions-body"></p></dialog>
<script src="/static/ui.js"></script><script src="/static/lobbyMenu.js"></script>
</body></html>
